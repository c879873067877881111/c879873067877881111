name: Update contributions

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Taipei).
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate contributions section
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-contributions.sh "${{ github.repository_owner }}"

      - name: Commit when the list changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Contributions section is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "chore: refresh open source contributions" -- README.md
          git push
